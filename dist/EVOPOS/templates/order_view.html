<!DOCTYPE html>
<html lang="az">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>EVOPOS - Sifarişə bax</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <style>

        .view-page {
            padding: 30px;
        }

        .view-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .back-button {
            border: none;
            background: #34495e;
            color: white;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
        }

        .order-box {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        .order-info {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        .info-box {
            background: #f5f7f9;
            padding: 15px;
            border-radius: 8px;
        }

        .info-title {
            color: #777;
            font-size: 13px;
        }

        .info-value {
            font-size: 18px;
            font-weight: bold;
            margin-top: 5px;
        }

        .order-item {
            display: flex;
            justify-content: space-between;
            padding: 14px 0;
            border-bottom: 1px solid #eee;
        }

        .order-total {
            text-align: right;
            font-size: 22px;
            font-weight: bold;
            margin-top: 20px;
        }

        @media (max-width: 800px) {

            .order-info {
                grid-template-columns: repeat(2, 1fr);
            }

        }

    </style>

</head>

<body>

<div class="app-container">

    {% include 'sidebar.html' %}

    <main class="main-content">

        <div class="view-page">

            <div class="view-header">

                <h1>🧾 Sifarişə bax</h1>

                <button class="back-button"
                        onclick="window.location.href='/orders'">
                    ← Sifarişlər
                </button>

            </div>


            <div id="orderBox"
                 class="order-box">

                Yüklənir...

            </div>

        </div>

    </main>

</div>


<script>

const orderId =
    {{ order_id }};


async function loadOrder() {

    const response =
        await fetch(`/api/order/${orderId}`);

    const result =
        await response.json();


    const box =
        document.getElementById("orderBox");


    if (!result.success) {

        box.innerHTML =
            "Sifariş tapılmadı.";

        return;

    }


    const order =
        result.order;


    box.innerHTML = `

        <div class="order-info">

            <div class="info-box">

                <div class="info-title">
                    Sifariş
                </div>

                <div class="info-value">
                    #${order.id}
                </div>

            </div>

            <div class="info-box">

                <div class="info-title">
                    Masa
                </div>

                <div class="info-value">
                    ${order.table_number}
                </div>

            </div>

            <div class="info-box">

                <div class="info-title">
                    Status
                </div>

                <div class="info-value">
                    ${order.status}
                </div>

            </div>

            <div class="info-box">

                <div class="info-title">
                    Tarix
                </div>

                <div class="info-value">
                    ${order.created_at}
                </div>

            </div>

        </div>


        <h2>Məhsullar</h2>

        ${order.items.map(item => `

            <div class="order-item">

                <div>
                    ${item.name}
                    × ${item.quantity}
                </div>

                <div>
                    ${(item.price * item.quantity).toFixed(2)} ₼
                </div>

            </div>

        `).join("")}


        <div class="order-total">

            Cəmi:
            ${Number(order.total).toFixed(2)} ₼

        </div>

    `;

}


loadOrder();

</script>

</body>

</html>
