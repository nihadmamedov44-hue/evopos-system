<!DOCTYPE html>
<html lang="az">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>EVOPOS - Sifarişlər</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <style>

        .orders-page {
            padding: 30px;
            min-height: 100vh;
            background: #f4f6f8;
            box-sizing: border-box;
        }

        .orders-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .orders-title h1 {
            margin: 0;
            font-size: 28px;
            color: #1f2933;
        }

        .orders-title p {
            margin: 7px 0 0;
            color: #7b8794;
            font-size: 14px;
        }

        .refresh-button {
            border: none;
            background: #1b2a38;
            color: white;
            padding: 11px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
        }

        .refresh-button:hover {
            background: #263b4d;
        }

        /* SEARCH */

        .orders-tools {
            background: white;
            padding: 18px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 2px 10px rgba(0,0,0,.05);
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .search-input {
            flex: 1;
            height: 42px;
            border: 1px solid #d9e2ec;
            border-radius: 8px;
            padding: 0 13px;
            font-size: 14px;
            box-sizing: border-box;
        }

        .search-input:focus {
            outline: none;
            border-color: #3498db;
        }

        .filter-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .filter-button {
            border: none;
            background: #edf0f2;
            color: #323f4b;
            padding: 9px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
        }

        .filter-button:hover {
            background: #dfe5e9;
        }

        .filter-button.active {
            background: #3498db;
            color: white;
        }

        /* STATISTICS */

        .orders-stats {
            display: grid;
            grid-template-columns:
                repeat(4, minmax(0, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: white;
            border-radius: 12px;
            padding: 18px;
            box-shadow: 0 2px 10px rgba(0,0,0,.05);
        }

        .stat-label {
            color: #7b8794;
            font-size: 13px;
            margin-bottom: 7px;
        }

        .stat-value {
            font-size: 23px;
            font-weight: bold;
            color: #1f2933;
        }

        /* TABLE */

        .orders-table-container {
            background: white;
            border-radius: 12px;
            overflow-x: auto;
            box-shadow: 0 2px 10px rgba(0,0,0,.05);
        }

        .orders-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 950px;
        }

        .orders-table th {
            background: #f7f9fa;
            color: #52606d;
            font-size: 13px;
            font-weight: bold;
            text-align: left;
            padding: 15px;
            border-bottom: 1px solid #e5e9ec;
        }

        .orders-table td {
            padding: 15px;
            border-bottom: 1px solid #edf0f2;
            font-size: 14px;
            color: #323f4b;
        }

        .orders-table tr:hover td {
            background: #fafbfc;
        }

        .order-id {
            font-weight: bold;
            color: #1976d2;
        }

        .table-number {
            font-weight: bold;
        }

        .amount {
            font-weight: bold;
            white-space: nowrap;
        }

        /* STATUS */

        .status-badge {
            display: inline-flex;
            align-items: center;
            padding: 6px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            white-space: nowrap;
        }

        .status-yeni {
            background: #e3f2fd;
            color: #1565c0;
        }

        .status-hazirlanir {
            background: #fff3e0;
            color: #ef6c00;
        }

        .status-hazirdir {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .status-tamamlandi {
            background: #e8f5e9;
            color: #1b5e20;
        }

        /* PAYMENT */

        .payment-badge {
            display: inline-flex;
            align-items: center;
            padding: 6px 10px;
            border-radius: 20px;
            background: #f1f5f8;
            color: #52606d;
            font-size: 12px;
        }

        /* ACTIONS */

        .action-buttons {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .action-button {
            border: none;
            padding: 7px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            color: white;
        }

        .view-button {
            background: #3498db;
        }

        .view-button:hover {
            background: #2980b9;
        }

        .receipt-button {
            background: #7b1fa2;
        }

        .receipt-button:hover {
            background: #6a1b86;
        }

        .delete-button {
            background: #e74c3c;
        }

        .delete-button:hover {
            background: #c0392b;
        }

        /* EMPTY */

        .empty-orders {
            text-align: center;
            padding: 60px 20px;
            color: #7b8794;
        }

        .empty-orders-icon {
            font-size: 55px;
            margin-bottom: 10px;
        }

        .loading {
            text-align: center;
            padding: 50px;
            color: #7b8794;
        }

        .error-message {
            text-align: center;
            padding: 40px;
            color: #c0392b;
        }

        /* MODAL */

        .details-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.55);
            z-index: 3000;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .details-modal.show {
            display: flex;
        }

        .details-content {
            width: 100%;
            max-width: 650px;
            max-height: 90vh;
            overflow-y: auto;
            background: white;
            border-radius: 14px;
            box-sizing: border-box;
        }

        .details-header {
            padding: 20px;
            border-bottom: 1px solid #edf0f2;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .details-header h2 {
            margin: 0;
            font-size: 21px;
            color: #1f2933;
        }

        .close-button {
            width: 35px;
            height: 35px;
            border: none;
            border-radius: 7px;
            background: #edf0f2;
            cursor: pointer;
            font-size: 18px;
        }

        .close-button:hover {
            background: #dfe5e9;
        }

        .details-body {
            padding: 20px;
        }

        .details-info {
            display: grid;
            grid-template-columns:
                repeat(2, minmax(0, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }

        .info-box {
            background: #f7f9fa;
            padding: 12px;
            border-radius: 8px;
        }

        .info-label {
            color: #7b8794;
            font-size: 12px;
            margin-bottom: 4px;
        }

        .info-value {
            color: #1f2933;
            font-weight: bold;
            font-size: 14px;
        }

        .details-items-title {
            font-size: 17px;
            font-weight: bold;
            color: #1f2933;
            margin-bottom: 10px;
        }

        .detail-item {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            padding: 12px 0;
            border-bottom: 1px solid #edf0f2;
        }

        .detail-item-name {
            font-weight: bold;
        }

        .detail-item-meta {
            color: #7b8794;
            font-size: 13px;
            margin-top: 3px;
        }

        .detail-item-total {
            font-weight: bold;
            white-space: nowrap;
        }

        .details-total {
            display: flex;
            justify-content: space-between;
            margin-top: 18px;
            padding-top: 15px;
            border-top: 2px solid #1b2a38;
            font-size: 19px;
            font-weight: bold;
        }

        .details-footer {
            padding: 15px 20px;
            border-top: 1px solid #edf0f2;
            display: flex;
            gap: 10px;
        }

        .modal-action {
            flex: 1;
            border: none;
            height: 42px;
            border-radius: 8px;
            cursor: pointer;
            color: white;
            font-weight: bold;
        }

        .modal-receipt {
            background: #7b1fa2;
        }

        .modal-close {
            background: #95a5a6;
        }

        @media (max-width: 1000px) {

            .orders-stats {
                grid-template-columns:
                    repeat(2, minmax(0, 1fr));
            }

        }

        @media (max-width: 700px) {

            .orders-page {
                padding: 15px;
            }

            .orders-stats {
                grid-template-columns: 1fr;
            }

            .details-info {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>

<div class="app-container">

    {% include 'sidebar.html' %}


    <main class="main-content">

        <div class="orders-page">


            <!-- HEADER -->

            <div class="orders-header">

                <div class="orders-title">

                    <h1>
                        📋 Sifarişlər
                    </h1>

                    <p>
                        Bütün sifarişləri idarə edin
                    </p>

                </div>


                <button
                    class="refresh-button"
                    onclick="loadOrders()">

                    🔄 Yenilə

                </button>

            </div>


            <!-- AXTARIŞ VƏ FİLTR -->

            <div class="orders-tools">

                <div class="search-box">

                    <input
                        id="searchInput"
                        class="search-input"
                        type="text"
                        placeholder="🔎 Sifariş nömrəsi və ya masa axtar..."
                        oninput="applyFilters()">

                </div>


                <div class="filter-buttons">

                    <button
                        class="filter-button active"
                        onclick="setFilter('Hamısı', this)">

                        Hamısı

                    </button>


                    <button
                        class="filter-button"
                        onclick="setFilter('Aktiv', this)">

                        🟢 Aktiv

                    </button>


                    <button
                        class="filter-button"
                        onclick="setFilter('Tamamlandı', this)">

                        ✅ Tamamlandı

                    </button>

                </div>

            </div>


            <!-- STATİSTİKALAR -->

            <div class="orders-stats">

                <div class="stat-card">

                    <div class="stat-label">
                        Bütün sifarişlər
                    </div>

                    <div
                        id="totalOrders"
                        class="stat-value">

                        0

                    </div>

                </div>


                <div class="stat-card">

                    <div class="stat-label">
                        Aktiv sifarişlər
                    </div>

                    <div
                        id="activeOrders"
                        class="stat-value">

                        0

                    </div>

                </div>


                <div class="stat-card">

                    <div class="stat-label">
                        Tamamlanan
                    </div>

                    <div
                        id="completedOrders"
                        class="stat-value">

                        0

                    </div>

                </div>


                <div class="stat-card">

                    <div class="stat-label">
                        Ümumi satış
                    </div>

                    <div
                        id="totalSales"
                        class="stat-value">

                        0.00 ₼

                    </div>

                </div>

            </div>


            <!-- SİFARİŞ CƏDVƏLİ -->

            <div class="orders-table-container">

                <div
                    id="ordersContainer">

                    <div class="loading">
                        Sifarişlər yüklənir...
                    </div>

                </div>

            </div>

        </div>

    </main>

</div>


<!-- =====================================================
     SİFARİŞ DETALLARI MODALI
===================================================== -->

<div
    id="detailsModal"
    class="details-modal">

    <div class="details-content">


        <div class="details-header">

            <h2 id="detailsTitle">
                Sifariş
            </h2>

            <button
                class="close-button"
                onclick="closeDetails()">

                ×

            </button>

        </div>


        <div
            id="detailsBody"
            class="details-body">

            Yüklənir...

        </div>


        <div class="details-footer">

            <button
                id="detailsReceiptButton"
                class="modal-action modal-receipt"
                onclick="openReceiptFromModal()">

                🧾 Çeki aç

            </button>


            <button
                class="modal-action modal-close"
                onclick="closeDetails()">

                Bağla

            </button>

        </div>

    </div>

</div>


<script>

let allOrders = [];

let currentFilter = "Hamısı";

let selectedOrderId = null;


/* =====================================================
   SİFARİŞLƏRİ YÜKLƏ
===================================================== */

async function loadOrders() {

    const container =
        document.getElementById(
            "ordersContainer"
        );


    try {

        const response =
            await fetch("/api/orders");


        if (!response.ok) {

            throw new Error(
                "Sifarişləri almaq mümkün olmadı."
            );

        }


        const data =
            await response.json();


        allOrders =
            Array.isArray(data)
                ? data
                : (
                    Array.isArray(data.orders)
                        ? data.orders
                        : []
                );


        updateStatistics();

        applyFilters();


    } catch (error) {

        console.error(error);


        container.innerHTML = `

            <div class="error-message">

                <h3>
                    Sifarişlər yüklənmədi
                </h3>

                <p>
                    ${escapeHtml(error.message)}
                </p>

            </div>

        `;

    }

}


/* =====================================================
   STATİSTİKALAR
===================================================== */

function updateStatistics() {

    const total =
        allOrders.length;


    const active =
        allOrders.filter(
            order =>
                order.status !==
                "Tamamlandı"
        ).length;


    const completed =
        allOrders.filter(
            order =>
                order.status ===
                "Tamamlandı"
        ).length;


    const sales =
        allOrders
            .filter(
                order =>
                    order.status ===
                    "Tamamlandı"
            )
            .reduce(
                (
                    sum,
                    order
                ) =>
                    sum +
                    Number(
                        order.total || 0
                    ),
                0
            );


    document.getElementById(
        "totalOrders"
    ).textContent = total;


    document.getElementById(
        "activeOrders"
    ).textContent = active;


    document.getElementById(
        "completedOrders"
    ).textContent = completed;


    document.getElementById(
        "totalSales"
    ).textContent =
        `${sales.toFixed(2)} ₼`;

}


/* =====================================================
   FİLTR
===================================================== */

function setFilter(filter, button) {

    currentFilter = filter;


    document
        .querySelectorAll(".filter-button")
        .forEach(
            item =>
                item.classList.remove("active")
        );


    button.classList.add("active");


    applyFilters();

}


/* =====================================================
   FİLTRLƏRİ TƏTBİQ ET
===================================================== */

function applyFilters() {

    const search =
        document
            .getElementById(
                "searchInput"
            )
            .value
            .trim()
            .toLowerCase();


    let filtered =
        [...allOrders];


    if (currentFilter === "Aktiv") {

        filtered =
            filtered.filter(
                order =>
                    order.status !==
                    "Tamamlandı"
            );

    }


    if (currentFilter === "Tamamlandı") {

        filtered =
            filtered.filter(
                order =>
                    order.status ===
                    "Tamamlandı"
            );

    }


    if (search) {

        filtered =
            filtered.filter(order => {

                const id =
                    String(
                        order.id || ""
                    ).toLowerCase();


                const table =
                    String(
                        order.table_number || ""
                    ).toLowerCase();


                return (
                    id.includes(search) ||
                    table.includes(search)
                );

            });

    }


    renderOrders(filtered);

}


/* =====================================================
   STATUS
===================================================== */

function getStatusClass(status) {

    if (status === "Yeni") {

        return "status-yeni";

    }


    if (status === "Hazırlanır") {

        return "status-hazirlanir";

    }


    if (status === "Hazırdır") {

        return "status-hazirdir";

    }


    if (status === "Tamamlandı") {

        return "status-tamamlandi";

    }


    return "status-yeni";

}


/* =====================================================
   SİFARİŞLƏRİ GÖSTƏR
===================================================== */

function renderOrders(orders) {

    const container =
        document.getElementById(
            "ordersContainer"
        );


    if (!orders.length) {

        container.innerHTML = `

            <div class="empty-orders">

                <div class="empty-orders-icon">
                    📋
                </div>

                <h3>
                    Sifariş tapılmadı
                </h3>

                <p>
                    Seçdiyiniz filtr üzrə sifariş yoxdur.
                </p>

            </div>

        `;

        return;

    }


    container.innerHTML = `

        <table class="orders-table">

            <thead>

                <tr>

                    <th>
                        Sifariş
                    </th>

                    <th>
                        Masa
                    </th>

                    <th>
                        Məbləğ
                    </th>

                    <th>
                        Status
                    </th>

                    <th>
                        Ödəniş
                    </th>

                    <th>
                        Tarix
                    </th>

                    <th>
                        Əməliyyat
                    </th>

                </tr>

            </thead>


            <tbody>

                ${orders.map(order => {

                    const total =
                        Number(
                            order.total || 0
                        );


                    const payment =
                        order.payment_method ||
                        "—";


                    const created =
                        formatDate(
                            order.created_at
                        );


                    return `

                        <tr>

                            <td>

                                <span class="order-id">

                                    #${order.id}

                                </span>

                            </td>


                            <td>

                                <span class="table-number">

                                    Masa ${order.table_number}

                                </span>

                            </td>


                            <td>

                                <span class="amount">

                                    ${total.toFixed(2)} ₼

                                </span>

                            </td>


                            <td>

                                <span
                                    class="status-badge
                                    ${getStatusClass(
                                        order.status
                                    )}">

                                    ${getStatusIcon(
                                        order.status
                                    )}

                                    ${escapeHtml(
                                        order.status ||
                                        "Naməlum"
                                    )}

                                </span>

                            </td>


                            <td>

                                <span class="payment-badge">

                                    ${getPaymentIcon(
                                        payment
                                    )}

                                    ${escapeHtml(
                                        payment
                                    )}

                                </span>

                            </td>


                            <td>

                                ${created}

                            </td>


                            <td>

                                <div class="action-buttons">


                                    <button
                                        class="action-button view-button"
                                        onclick="viewOrder(${order.id})">

                                        👁️ Bax

                                    </button>


                                    ${
                                        order.status ===
                                        "Tamamlandı"

                                        ?

                                        `

                                        <button
                                            class="action-button receipt-button"
                                            onclick="openReceipt(${order.id})">

                                            🧾 Çek

                                        </button>

                                        `

                                        :

                                        `

                                        <button
                                            class="action-button delete-button"
                                            onclick="deleteOrder(${order.id})">

                                            🗑️ Ləğv

                                        </button>

                                        `
                                    }


                                </div>

                            </td>

                        </tr>

                    `;

                }).join("")}

            </tbody>

        </table>

    `;

}


/* =====================================================
   SİFARİŞƏ BAX
===================================================== */

async function viewOrder(orderId) {

    selectedOrderId =
        Number(orderId);


    const modal =
        document.getElementById(
            "detailsModal"
        );


    const body =
        document.getElementById(
            "detailsBody"
        );


    document.getElementById(
        "detailsTitle"
    ).textContent =
        `Sifariş #${orderId}`;


    body.innerHTML = `
        <div class="loading">
            Sifariş məlumatları yüklənir...
        </div>
    `;


    modal.classList.add("show");


    try {

        const response =
            await fetch(
                `/api/order/${orderId}`
            );


        const data =
            await response.json();


        if (!response.ok || !data.success) {

            throw new Error(
                data.message ||
                "Sifariş məlumatı alınmadı."
            );

        }


        const order =
            data.order;


        const items =
            data.items || [];


        const total =
            Number(
                order.total || 0
            );


        body.innerHTML = `

            <div class="details-info">


                <div class="info-box">

                    <div class="info-label">
                        Sifariş
                    </div>

                    <div class="info-value">
                        #${order.id}
                    </div>

                </div>


                <div class="info-box">

                    <div class="info-label">
                        Masa
                    </div>

                    <div class="info-value">
                        Masa ${order.table_number}
                    </div>

                </div>


                <div class="info-box">

                    <div class="info-label">
                        Status
                    </div>

                    <div class="info-value">
                        ${escapeHtml(
                            order.status ||
                            "—"
                        )}
                    </div>

                </div>


                <div class="info-box">

                    <div class="info-label">
                        Ödəniş
                    </div>

                    <div class="info-value">
                        ${escapeHtml(
                            order.payment_method ||
                            "Ödənilməyib"
                        )}
                    </div>

                </div>


                <div class="info-box">

                    <div class="info-label">
                        Verilən məbləğ
                    </div>

                    <div class="info-value">
                        ${Number(
                            order.paid_amount || 0
                        ).toFixed(2)} ₼
                    </div>

                </div>


                <div class="info-box">

                    <div class="info-label">
                        Qalıq
                    </div>

                    <div class="info-value">
                        ${Number(
                            order.change_amount || 0
                        ).toFixed(2)} ₼
                    </div>

                </div>


                <div class="info-box">

                    <div class="info-label">
                        Yaradılıb
                    </div>

                    <div class="info-value">
                        ${formatDate(
                            order.created_at
                        )}
                    </div>

                </div>


                <div class="info-box">

                    <div class="info-label">
                        Ödəniş vaxtı
                    </div>

                    <div class="info-value">
                        ${
                            order.paid_at
                                ? formatDate(
                                    order.paid_at
                                )
                                : "—"
                        }
                    </div>

                </div>

            </div>


            <div class="details-items-title">

                🍽️ Məhsullar

            </div>


            ${
                items.length

                ?

                items.map(item => `

                    <div class="detail-item">

                        <div>

                            <div class="detail-item-name">

                                ${escapeHtml(
                                    item.product_name ||
                                    item.name ||
                                    "Məhsul"
                                )}

                            </div>

                            <div class="detail-item-meta">

                                ${Number(
                                    item.price || 0
                                ).toFixed(2)}
                                ₼ ×
                                ${Number(
                                    item.quantity || 0
                                )}

                            </div>

                        </div>


                        <div class="detail-item-total">

                            ${(
                                Number(
                                    item.price || 0
                                ) *
                                Number(
                                    item.quantity || 0
                                )
                            ).toFixed(2)} ₼

                        </div>

                    </div>

                `).join("")

                :

                `

                <div class="empty-orders">

                    Məhsul yoxdur.

                </div>

                `
            }


            <div class="details-total">

                <span>
                    Cəmi
                </span>

                <span>
                    ${total.toFixed(2)} ₼
                </span>

            </div>

        `;


        const receiptButton =
            document.getElementById(
                "detailsReceiptButton"
            );


        if (
            order.status ===
            "Tamamlandı"
        ) {

            receiptButton.style.display =
                "block";

        } else {

            receiptButton.style.display =
                "none";

        }


    } catch (error) {

        console.error(error);


        body.innerHTML = `

            <div class="error-message">

                ${escapeHtml(
                    error.message
                )}

            </div>

        `;

    }

}


/* =====================================================
   MODALDAN ÇEK
===================================================== */

function openReceiptFromModal() {

    if (!selectedOrderId) {

        return;

    }


    openReceipt(
        selectedOrderId
    );

}


/* =====================================================
   ÇEKİ AÇ
===================================================== */

function openReceipt(orderId) {

    window.open(
        `/receipt/${orderId}`,
        "_blank"
    );

}


/* =====================================================
   MODALI BAĞLA
===================================================== */

function closeDetails() {

    document
        .getElementById(
            "detailsModal"
        )
        .classList.remove("show");


    selectedOrderId = null;

}


/* =====================================================
   SİFARİŞİ LƏĞV ET
===================================================== */

async function deleteOrder(orderId) {

    const order =
        allOrders.find(
            item =>
                Number(item.id) ===
                Number(orderId)
        );


    if (!order) {

        return;

    }


    const confirmed =
        confirm(
            `Sifariş #${orderId} ləğv edilsin?`
        );


    if (!confirmed) {

        return;

    }


    try {

        const response =
            await fetch(
                `/api/order/${orderId}/delete`,
                {
                    method: "DELETE"
                }
            );


        const data =
            await response.json();


        if (!response.ok || !data.success) {

            throw new Error(
                data.message ||
                "Sifariş ləğv edilmədi."
            );

        }


        await loadOrders();


    } catch (error) {

        console.error(error);


        alert(
            error.message ||
            "Sifariş ləğv edilərkən xəta baş verdi."
        );

    }

}


/* =====================================================
   ÖDƏNİŞ İKONU
===================================================== */

function getPaymentIcon(payment) {

    if (payment === "Nağd") {

        return "💵";

    }


    if (payment === "Kart") {

        return "💳";

    }


    return "—";

}


/* =====================================================
   STATUS İKONU
===================================================== */

function getStatusIcon(status) {

    if (status === "Yeni") {

        return "🆕";

    }


    if (status === "Hazırlanır") {

        return "👨‍🍳";

    }


    if (status === "Hazırdır") {

        return "✅";

    }


    if (status === "Tamamlandı") {

        return "✔️";

    }


    return "•";

}


/* =====================================================
   TARİX
===================================================== */

function formatDate(value) {

    if (!value) {

        return "—";

    }


    const date =
        new Date(
            value.replace(" ", "T")
        );


    if (isNaN(date.getTime())) {

        return escapeHtml(
            String(value)
        );

    }


    return date.toLocaleString(
        "az-AZ",
        {
            day: "2-digit",
            month: "2-digit",
            year: "numeric",
            hour: "2-digit",
            minute: "2-digit"
        }
    );

}


/* =====================================================
   HTML TƏHLÜKƏSİZLİYİ
===================================================== */

function escapeHtml(value) {

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        value ?? "";


    return div.innerHTML;

}


/* =====================================================
   MODALI ÇÖLƏ BASANDA BAĞLA
===================================================== */

document.addEventListener(
    "click",
    function(event) {

        const modal =
            document.getElementById(
                "detailsModal"
            );


        if (
            event.target ===
            modal
        ) {

            closeDetails();

        }

    }
);


/* =====================================================
   ESC
===================================================== */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key ===
            "Escape"
        ) {

            closeDetails();

        }

    }
);


/* =====================================================
   BAŞLANĞIC
===================================================== */

loadOrders();


/* =====================================================
   AVTOMATİK YENİLƏ
===================================================== */

setInterval(
    loadOrders,
    5000
);

</script>
